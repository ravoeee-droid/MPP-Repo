name: MPP Build Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate production image resolution
        run: npm run validate:images

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium for visual QA
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start > /tmp/mpp-next.log 2>&1 &
          echo $! > /tmp/mpp-next.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mpp-next.log
          exit 1

      - name: Golden Master browser QA
        run: npm run qa:visual

      - name: Upload visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpp-visual-qa
          path: artifacts/visual-qa
          if-no-files-found: warn
          retention-days: 7
